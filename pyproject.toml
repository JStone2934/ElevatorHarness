[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elevator-harness"
version = "0.1.0"
description = "Robot- and agent-independent visual panel-operation harness"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ElevatorHarness contributors"}]
dependencies = []

[project.urls]
Repository = "https://github.com/JStone2934/ElevatorHarness"
Issues = "https://github.com/JStone2934/ElevatorHarness/issues"

[project.optional-dependencies]
vision = ["Pillow>=9.1"]
test = ["pytest>=7", "numpy<2", "Pillow", "opencv-python-headless<4.12"]
build = ["build", "twine"]
s1 = ["numpy<2", "Pillow"]

[project.scripts]
elevator-harness = "elevator_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["elevator_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
